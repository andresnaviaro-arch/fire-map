name: Refresh fire data

on:
  schedule:
    # 05:40 UTC daily — after the overnight VIIRS passes have been processed.
    - cron: "40 5 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull today's detections from NASA FIRMS
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python3 scripts/fetch_fires.py

      - name: Commit if the data changed
        run: |
          git config user.name  "fire-map-bot"
          git config user.email "fire-map-bot@users.noreply.github.com"
          git add data/fires.json
          git diff --staged --quiet || git commit -m "Fire data $(date -u +%Y-%m-%d)"
          git push
